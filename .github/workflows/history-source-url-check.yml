name: Historical source URL diagnostics
on:
  workflow_dispatch:
  schedule:
    - cron: '17 2 * * *' # Daily 11:17 KST (UTC+9)
  pull_request:
    paths:
      - "scripts/check_history_source_urls.py"
      - "tests/test_history_source_urls.py"
      - "tests/fixtures/history_source_url_smoke.csv"
      - ".github/workflows/history-source-url-check.yml"
permissions:
  contents: read
jobs:
  source-url-check:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Run offline safety tests
        run: python -m unittest discover -s tests -p 'test_history_source_urls.py'
      - name: Run one-record live smoke test (PR only)
        if: github.event_name == 'pull_request'
        env:
          HISTORY_RECORDS_PATH: tests/fixtures/history_source_url_smoke.csv
          HISTORY_URL_REPORT_PATH: research-data/source_url_smoke_report.csv
        run: python scripts/check_history_source_urls.py
      - name: Upload smoke-test report
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v5
        with:
          name: seoul-history-source-url-smoke
          path: research-data/source_url_smoke_report.csv
          retention-days: 7
      - name: Run read-only URL diagnostics (manual or daily)
        if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
        run: python scripts/check_history_source_urls.py
      - name: Upload manual or daily report
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v5
        with:
          name: seoul-history-source-url-status
          path: research-data/source_url_report.csv
          retention-days: 30
