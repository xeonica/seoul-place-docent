name: Full test suite

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: pnpm/action-setup@v4
        with:
          version: 11.25.0
      - run: pnpm install --frozen-lockfile
      - name: Run complete test suite
        run: |
          mkdir -p outputs/test-repair
          pnpm test 2>&1 | tee outputs/test-repair/baseline-test.log
      - name: Upload complete test log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-test-suite-log-${{ github.run_id }}
          path: outputs/test-repair/baseline-test.log
          if-no-files-found: warn
          retention-days: 14
