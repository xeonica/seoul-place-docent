name: Historical catalog review export
on:
  workflow_dispatch:
  push:
    paths:
      - "research-data/*.csv"
      - "scripts/export_history_catalog.py"
      - ".github/workflows/history-catalog.yml"
  schedule:
    - cron: "0 */3 * * *"
permissions:
  contents: read
jobs:
  validate-export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install spreadsheet writer
        run: python -m pip install openpyxl==3.1.5
      - name: Validate CSV and generate review workbook
        run: python scripts/export_history_catalog.py
      - name: Upload workbook for review
        uses: actions/upload-artifact@v4
        with:
          name: seoul-place-docent-review
          path: research-data/seoul_place_docent_review.xlsx
          retention-days: 30
